server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index ARKANOID.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|wav|mp3)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript;
}
